[package]
name = "pai-sho"
version = "0.3.0"
edition = "2021"
description = "What happens when you want dumbpipe to stay running, handle a few ports at once, and reconnect when your laptop wakes up"
license = "MIT"
repository = "https://github.com/cablehead/pai-sho"

[dependencies]
# Networking
iroh = "0.97"
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Concurrent collections
dashmap = "6"

# TUN owned-network backend (userspace stack). See src/netstack.rs, ADR 0005.
tokio-smoltcp = "0.6"
libc = "0.2"

# Misc
rand = "0.9"

[profile.release]
lto = true
strip = true
