[package]
name = "pai-sho"
version = "0.3.1-dev"
edition = "2021"
description = "Drop one binary on a box with no way in. It dials home and punches through, so its ports show up on your laptop, each under its own name. Encrypted, peer-to-peer, default deny."
license = "MIT"
repository = "https://github.com/cablehead/pai-sho"
keywords = ["iroh", "quic", "p2p", "port-forwarding", "nat-traversal"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
# Networking
iroh = "1"
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Concurrent collections
dashmap = "6"

# TUN owned-network backend (userspace stack). See src/netstack.rs, ADR 0005.
tokio-smoltcp = "0.6"
libc = "0.2"

# Misc
rand = "0.9"

[profile.release]
lto = true
strip = true
