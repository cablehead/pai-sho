[package]
name = "pai-sho"
version = "0.5.6"
edition = "2021"
description = "Forward ports between your own machines, peer to peer over iroh. Neither side needs an account, a public IP, or an open inbound port. A port is reachable only by the peers you grant it to."
license = "MIT"
repository = "https://github.com/cablehead/pai-sho"
keywords = ["iroh", "quic", "p2p", "port-forwarding", "nat-traversal"]
categories = ["network-programming", "command-line-utilities"]

[lib]
name = "pai_sho"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
# Networking
iroh = "1"
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Concurrent collections
dashmap = "6"

# TUN owned-network backend (userspace stack). See src/netstack.rs, ADR 0005.
tokio-smoltcp = "0.6"
libc = "0.2"

# Misc
rand = "0.9"
qrcode = { version = "0.14.1", default-features = false }

[profile.release]
lto = true
strip = true

[dev-dependencies]
rqrr = { version = "0.11.0", default-features = false }
